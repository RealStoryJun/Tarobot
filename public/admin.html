<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarobot - 관리자 대시보드</title>
    <meta name="theme-color" content="#0c0a18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="min-h-screen">

<!-- 헤더 -->
<header class="admin-header h-16 flex justify-between items-center px-6 fixed top-0 left-0 right-0 z-50">
    <a href="index.html" class="font-title text-[#f0e68c] text-xl hover:opacity-80 transition-opacity">← Tarobot</a>
    <div class="flex items-center gap-3">
        <span id="admin-email" class="text-xs text-gray-400"></span>
        <span class="badge badge-member">관리자</span>
    </div>
</header>

<!-- 메인 -->
<main class="max-w-6xl mx-auto pt-24 px-4 pb-12">

    <!-- 로딩 상태 -->
    <div id="loading-state" class="state-container">
        <div class="loader-ring"></div>
        <p class="text-gray-400">관리자 권한을 확인 중...</p>
    </div>

    <!-- 접근 거부 -->
    <div id="denied-state" class="state-container hidden">
        <p class="text-4xl mb-2">🔒</p>
        <h2 class="text-xl font-title text-red-400">접근 권한 없음</h2>
        <p class="text-gray-400 text-sm">관리자 계정으로 로그인해야 접근할 수 있습니다.</p>
        <a href="index.html" class="mt-4 text-[#f0e68c] underline text-sm">메인으로 돌아가기</a>
    </div>

    <!-- 관리자 대시보드 (권한 확인 후 표시) -->
    <div id="admin-dashboard" class="hidden">
        <h1 class="text-2xl font-title text-[#f0e68c] mb-6">관리자 대시보드</h1>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="stat-box">
                <div id="stat-total" class="stat-number">-</div>
                <div class="stat-label">총 리딩 수</div>
            </div>
            <div class="stat-box">
                <div id="stat-members" class="stat-number">-</div>
                <div class="stat-label">회원 리딩</div>
            </div>
            <div class="stat-box">
                <div id="stat-anon" class="stat-number">-</div>
                <div class="stat-label">비회원 리딩</div>
            </div>
            <div class="stat-box">
                <div id="stat-today" class="stat-number">-</div>
                <div class="stat-label">오늘 리딩</div>
            </div>
        </div>

        <!-- 탭 -->
        <div class="flex gap-2 mb-6">
            <button class="tab-btn active" data-tab="readings" onclick="switchTab('readings')">리딩 기록</button>
            <button class="tab-btn" data-tab="users" onclick="switchTab('users')">사용자 통계</button>
        </div>

        <!-- 리딩 기록 탭 -->
        <div id="tab-readings" class="admin-card">
            <div class="overflow-x-auto">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>질문</th>
                            <th>유형</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody id="readings-tbody">
                        <tr><td colspan="4" class="text-center text-gray-500 py-8">로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-800">
                <span id="readings-info" class="text-xs text-gray-500"></span>
                <div class="flex gap-2">
                    <button id="prev-btn" class="page-btn" onclick="changePage(-1)" disabled>← 이전</button>
                    <button id="next-btn" class="page-btn" onclick="changePage(1)">다음 →</button>
                </div>
            </div>
        </div>

        <!-- 사용자 통계 탭 -->
        <div id="tab-users" class="admin-card hidden">
            <div class="overflow-x-auto">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>사용자 ID</th>
                            <th>총 리딩 수</th>
                            <th>마지막 리딩</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="3" class="text-center text-gray-500 py-8">로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { apiCall } from './api.js';
    import { escapeHtml } from './utils.js';

    let currentPage = 1;
    let totalReadings = 0;

    async function init() {
        if (!localStorage.getItem('sb-token')) return showDenied();

        try {
            const result = await apiCall('/api/admin/check', 'GET');
            if (!result.isAdmin) return showDenied();

            document.getElementById('admin-email').textContent = result.email;
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            loadReadings();
        } catch {
            showDenied();
        }
    }

    function showDenied() {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('denied-state').classList.remove('hidden');
    }

    async function loadReadings() {
        try {
            const result = await apiCall(`/api/admin/readings?page=${currentPage}`, 'GET');
            totalReadings = result.total || 0;
            const readings = result.data || [];

            document.getElementById('stat-total').textContent = totalReadings;
            const memberCount = readings.filter(r => r.user_id).length;
            document.getElementById('stat-members').textContent = memberCount;
            document.getElementById('stat-anon').textContent = readings.length - memberCount;

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('stat-today').textContent =
                readings.filter(r => r.created_at?.startsWith(today)).length;

            const tbody = document.getElementById('readings-tbody');
            if (readings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-gray-500 py-8">리딩 기록이 없습니다.</td></tr>';
            } else {
                tbody.innerHTML = readings.map(r => `
                    <tr>
                        <td class="text-gray-400">${new Date(r.created_at).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                        <td class="text-white">${escapeHtml(r.question || '-')}</td>
                        <td>${r.user_id ? '<span class="badge badge-member">회원</span>' : '<span class="badge badge-anon">비회원</span>'}</td>
                        <td class="text-gray-500 text-xs">${escapeHtml((r.user_id || r.session_id || '-').substring(0, 8))}...</td>
                    </tr>
                `).join('');
            }

            document.getElementById('readings-info').textContent = `${(currentPage-1)*30 + 1}~${Math.min(currentPage*30, totalReadings)} / 전체 ${totalReadings}건`;
            document.getElementById('prev-btn').disabled = currentPage <= 1;
            document.getElementById('next-btn').disabled = currentPage * 30 >= totalReadings;
        } catch (e) {
            document.getElementById('readings-tbody').innerHTML = `<tr><td colspan="4" class="text-center text-red-400 py-8">데이터를 불러오지 못했습니다: ${escapeHtml(e.message)}</td></tr>`;
        }
    }

    async function loadUsers() {
        try {
            const result = await apiCall('/api/admin/users', 'GET');
            const users = result.data || [];
            const tbody = document.getElementById('users-tbody');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-gray-500 py-8">사용자 통계를 불러오려면 Supabase에 get_user_stats 함수를 먼저 생성해 주세요.</td></tr>';
            } else {
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td class="text-gray-300">${escapeHtml((u.user_id || '비회원').substring(0, 12))}...</td>
                        <td class="text-white font-bold">${u.reading_count}회</td>
                        <td class="text-gray-400">${u.last_reading ? new Date(u.last_reading).toLocaleString('ko-KR') : '-'}</td>
                    </tr>
                `).join('');
            }
        } catch {
            document.getElementById('users-tbody').innerHTML = `<tr><td colspan="3" class="text-center text-red-400 py-8">함수를 불러오지 못했습니다.</td></tr>`;
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        document.getElementById('tab-readings').classList.toggle('hidden', tab !== 'readings');
        document.getElementById('tab-users').classList.toggle('hidden', tab !== 'users');
        if (tab === 'users') loadUsers();
    }

    function changePage(delta) {
        currentPage += delta;
        loadReadings();
    }

    // onclick 핸들러에서 접근할 수 있도록 전역 노출
    window.switchTab = switchTab;
    window.changePage = changePage;

    window.onload = init;
</script>
</body>
</html>
