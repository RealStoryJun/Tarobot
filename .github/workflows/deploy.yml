name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Note: Cloudflare Worker 는 Cloudflare Workers Builds (대시보드 Git 연동) 에서 자동 배포됨.
#       여기서는 Supabase Edge Functions 만 담당.

jobs:
  functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy handle-auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy handle-auth --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy handle-readings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy handle-readings --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
