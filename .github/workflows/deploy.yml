name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, worker, functions]

jobs:
  # ============ Cloudflare Worker ============
  worker:
    name: Deploy Cloudflare Worker
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'worker')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect worker changes
        id: diff
        if: github.event_name == 'push'
        run: |
          if git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -qE '^workers/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        run: npm install -g wrangler@4

      - name: Push Worker secrets
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL_NAME: ${{ secrets.AI_MODEL_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd workers/tarobot-api
          printf '%s' "$AI_API_KEY"      | wrangler secret put AI_API_KEY
          printf '%s' "$AI_MODEL_NAME"   | wrangler secret put AI_MODEL_NAME
          printf '%s' "$SUPABASE_URL"    | wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY

      - name: Deploy Worker
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/tarobot-api/wrangler.toml

  # ============ Supabase Edge Functions ============
  functions:
    name: Deploy Supabase Edge Functions
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'functions')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect function changes
        id: diff
        if: github.event_name == 'push'
        run: |
          if git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -qE '^supabase/(functions|config\.toml)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy handle-auth
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy handle-auth --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy handle-readings
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy handle-readings --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
